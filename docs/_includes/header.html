<header class="site-header" role="banner">
  <div class="sidebar-inner">
    <a class="profile-link" rel="author" href="{{ "/" | relative_url }}">
      <span class="profile-copy">
        <span class="site-title">Rhys Mills</span>
        <span class="site-role">Developer<br> at The Guardian</span>
      </span>
      <img
        src="{{ "assets/img/rhys-mills-2026.jpg" | relative_url }}"
        class="profile-photo"
        alt="Portrait of Rhys Mills"
      />
    </a>

    <input class="menu-toggle" id="menu-toggle" type="checkbox" />
    <label class="menu-toggle-label" for="menu-toggle">
      <span class="menu-toggle-icon" aria-hidden="true"></span>
      <span class="menu-toggle-text">Menu</span>
    </label>

    <div class="header-actions">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="nav-link" href="{{ "/" | relative_url }}"{% if page.url == "/" or page.layout == "post" %} aria-current="page"{% endif %}>
          <span class="nav-label">Writing</span>
        </a>
        <a class="nav-link" href="{{ "/about/" | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>
          <span class="nav-label">About</span>
        </a>
      </nav>

      <div class="site-connections">
        {%- include social.html -%}
        {%- include contact.html -%}
      </div>

      {%- include snake-game.html -%}
    </div>
  </div>
</header>
