<div class="snake-game" data-snake-game data-state="idle">
  <button class="snake-game-board" type="button" aria-label="Start the hidden Snake game">
    <canvas class="snake-game-canvas" width="88" height="88" aria-hidden="true"></canvas>
  </button>
  <div class="snake-game-meta" hidden>
    <span class="snake-game-score" aria-live="polite">Score: 0</span>
    <button class="snake-game-audio" type="button" aria-label="Mute game sounds" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path class="snake-game-audio-speaker" d="M3 8h3l4-3v10l-4-3H3z" />
        <path class="snake-game-audio-waves" d="M12.5 7.2c.8.7 1.2 1.6 1.2 2.8s-.4 2.1-1.2 2.8M15 5c1.4 1.3 2.1 3 2.1 5s-.7 3.7-2.1 5" />
        <path class="snake-game-audio-slash" d="M3.5 3.5l13 13" />
      </svg>
    </button>
    <button class="snake-game-restart" type="button" hidden>Play again?</button>
  </div>
</div>
